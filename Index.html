<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Aplikasi Administrasi Kelas Digital untuk guru wali kelas. Data tersimpan lokal di perangkat.">
<title>Administrasi Kelas Digital</title>
<style>
:root{
  --bg:#f1f5f9; --panel:#fff; --sidebar:#1e293b; --sidebar-2:#0f172a;
  --primary:#2563eb; --primary-d:#1d4ed8; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --success:#16a34a; --warn:#d97706; --danger:#dc2626; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
#app{display:flex;min-height:100vh}

/* ===== SIDEBAR ===== */
#sidebar{width:262px;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));color:#cbd5e1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:60;transition:transform .25s ease}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;flex-shrink:0}
.brand strong{display:block;color:#fff;font-size:14px;line-height:1.2}
.brand small{color:#94a3b8;font-size:11px}
#nav{flex:1;overflow-y:auto;padding:10px 8px 20px}
#nav::-webkit-scrollbar{width:6px}
#nav::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:transparent;color:#cbd5e1;border-radius:9px;cursor:pointer;text-align:left;font-size:13.2px;margin-bottom:2px;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.nav-item .ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sidebar-foot{padding:10px 12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#64748b}
.sidebar-foot .note{line-height:1.4;margin-bottom:8px}
.sidebar-foot button{width:100%;padding:8px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;cursor:pointer;font-size:12px}
.sidebar-foot button:hover{background:#334155;color:#fff}

/* ===== MAIN ===== */
#main{flex:1;min-width:0;margin-left:262px;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;z-index:40}
.topbar h1{font-size:17px;font-weight:700}
.hamburger{display:none;border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;line-height:1}
.spacer{flex:1}
.badge-kelas{background:#e0e7ff;color:#3730a3;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
#view{padding:18px;flex:1}
#overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:55}

/* ===== CARD / TOOLBAR ===== */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card-title{font-size:15px;font-weight:700;margin-bottom:4px}
.muted{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar-right{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.search-box{display:flex;align-items:center;gap:7px;background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:0 11px;flex:1;min-width:180px;max-width:340px}
.search-box input{border:0;background:transparent;outline:0;padding:9px 0;width:100%;color:var(--text)}
.btn{border:1px solid var(--border);background:#fff;color:#334155;padding:8px 13px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#f1f5f9}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-ghost{background:#f8fafc}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.icon-btn{border:1px solid var(--border);background:#fff;border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;font-size:13px;transition:.15s}
.icon-btn:hover{background:#f1f5f9}
.icon-btn.del:hover{background:#fee2e2;border-color:#fecaca}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* ===== TABLE ===== */
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{background:#f8fafc;text-align:left;padding:10px 12px;font-weight:700;color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafc}
.empty{text-align:center;color:var(--muted);padding:34px 12px;font-size:13px;background:#f8fafc;border-radius:10px;border:1px dashed var(--border)}

/* ===== FORM ===== */
.field label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);outline:0;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.field small{display:block;margin-top:4px;color:var(--muted);font-size:11.5px}
.req{color:var(--danger)}
.grid-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-form .full{grid-column:1/-1}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:100}
.modal{background:#fff;border-radius:14px;width:100%;max-width:580px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{padding:16px 18px;overflow-y:auto;display:grid;gap:13px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:12px 18px;border-top:1px solid var(--border);background:#f8fafc}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:15px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.stat .si{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.stat .sv{font-size:20px;font-weight:800;line-height:1.1}
.stat .sl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}

/* ===== CHART ===== */
.chart{display:grid;gap:9px}
.chart-row{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:12.5px}
.chart-label{color:#475569;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-track{background:#f1f5f9;border-radius:20px;height:16px;overflow:hidden}
.chart-bar{height:100%;border-radius:20px;transition:width .4s ease;min-width:2px}
.chart-val{text-align:right;font-weight:700;color:#334155}

/* ===== ABSEN ===== */
.absen-group{display:flex;gap:5px;flex-wrap:wrap}
.absen-btn{padding:5px 11px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:11.5px;font-weight:700;color:#64748b;transition:.12s}
.absen-btn:hover{background:#f1f5f9}
.absen-btn.active{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill.g{background:#dcfce7;color:#166534}
.pill.y{background:#fef3c7;color:#92400e}
.pill.b{background:#dbeafe;color:#1e40af}
.pill.r{background:#fee2e2;color:#991b1b}
.pill.n{background:#f1f5f9;color:#475569}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,26px);background:#0f172a;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.28s;z-index:200;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== RESPONSIVE ===== */
@media(max-width:1024px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:none}
  #main{margin-left:0}
  .hamburger{display:block}
  #overlay.show{display:block}
}
@media(max-width:720px){
  #view{padding:12px}
  .topbar{padding:10px 12px}
  .topbar h1{font-size:15px}
  .badge-kelas{max-width:130px;font-size:11px}
  .card{padding:12px;border-radius:10px}
  .grid-form{grid-template-columns:1fr}
  .toolbar-right{width:100%;margin-left:0}
  .toolbar-right .btn{flex:1;justify-content:center}
  .search-box{max-width:none}
  .table-wrap{border:0;overflow:visible}
  table{min-width:0}
  .table-wrap table,.table-wrap thead,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block}
  .table-wrap thead{display:none}
  .table-wrap tr{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:6px 10px;background:#fff}
  .table-wrap td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 0;text-align:right}
  .table-wrap td::before{content:attr(data-label);font-weight:700;color:var(--muted);font-size:11.5px;text-transform:uppercase;text-align:left;flex-shrink:0}
  .row-actions{justify-content:flex-end}
  .chart-row{grid-template-columns:80px 1fr 40px;font-size:11.5px}
  .stat .sv{font-size:17px}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-icon">AK</div>
      <div>
        <strong>Administrasi Kelas</strong>
        <small>Digital &amp; Terpadu</small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="note">💾 Data tersimpan lokal di perangkat ini (localStorage browser). Lakukan pencadangan berkala melalui menu Laporan.</div>
      <button id="btnQuickBackup">⬇ Cadangkan Data (JSON)</button>
    </div>
  </aside>

  <div id="overlay"></div>

  <main id="main">
    <header class="topbar">
      <button class="hamburger" id="btnMenu" aria-label="Buka menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <span class="badge-kelas" id="badgeKelas">Kelas belum diatur</span>
    </header>
    <div id="view"></div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
